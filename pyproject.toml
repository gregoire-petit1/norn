[project]
name = "norn"
version = "0.1.0"
description = "Open-source, model-agnostic coding agent with persistent memory and multi-agent orchestration"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "litellm>=1.50",
    "pyyaml>=6.0",
    "aiofiles>=24.0",
    "filelock>=3.15",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "prompt-toolkit>=3.0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
ml = [
    "torch>=2.0",
    "polars>=1.0",
    "scikit-learn>=1.5",
]
web = [
    "httpx>=0.27",
]
mcp_tools = [
    "mcp>=1.0",
]
rag = [
    "rank-bm25>=0.2",
    "chromadb>=0.5",
    "httpx>=0.27",
]

[project.scripts]
norn = "norn.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/norn"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "no_log_redirect: opt out of the autouse ``_redirect_default_log_dir`` fixture (for tests asserting on production defaults)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
