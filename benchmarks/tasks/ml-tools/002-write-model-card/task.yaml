id: "ml-tools-002-write-model-card"
category: "ml-tools"
description: "Write a model card for a trained model"
prompt: |
  Read the files src/train.py and metrics.json, then write a Model Card
  to the file MODEL_CARD.md using the file_write tool. Follow best practices.
  Include: model description, intended use, training data summary,
  performance metrics, limitations, and ethical considerations.
  You MUST create the file MODEL_CARD.md in the project root.
seed_dir: "seed/"
eval_command: "test -f MODEL_CARD.md && wc -w MODEL_CARD.md | awk '{if ($1 >= 50) exit 0; else exit 1}'"
timeout_seconds: 240
metadata:
  difficulty: "medium"
  tags: ["ml-tools", "model-card", "documentation"]
