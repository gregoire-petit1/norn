# configs/default.yaml
llm:
  provider: "ollama"
  model: "qwen3-coder:480b-cloud"
  fallback_provider: "openrouter"
  fallback_model: "qwen/qwen3-coder:free"
  # Verified free OpenRouter models with tool support:
  #   stepfun/step-3.5-flash:free             (StepFun, 256k ctx, reasoning, TESTED OK)
  #   nvidia/nemotron-3-super-120b-a12b:free  (Nvidia, 262k ctx, fast)
  #   qwen/qwen3.6-plus-preview:free          (Alibaba, 1M ctx, reasoning)
  #   qwen/qwen3-coder:free                   (Alibaba, 262k ctx, code-focused)
  # Paid models (require credits):
  #   anthropic/claude-sonnet-4
  # For Ollama local:
  #   provider: "ollama"
  #   model: "qwen2.5-coder:14b"
  temperature: 0.0
  max_tokens: 4096
  # Phase 9 v2 — Workstream G. Tag system prompt + last tool schema with
  # `cache_control: ephemeral` for providers that honour it (Anthropic
  # direct, Anthropic via OpenRouter, OpenAI gpt-4o/4.1). Harmless on
  # other providers thanks to an internal eligibility gate. Disable to
  # opt out globally.
  prompt_cache: true

permissions:
  mode: "interactive"  # interactive | auto | yolo | strict

flags:
  dream_system: false   # Phase 3
  coordinator: false    # Phase 4
  ml_tools: true        # Phase 5: PyTorch/Polars/sklearn tools
  web_search: false     # Phase 6: DuckDuckGo search + web fetch
  mcp: false            # Phase 6: MCP server tools
  coderag: false         # Phase 4: CodeRAG hybrid retrieval (vector search needs [rag] extra)
  axi_output: false      # Wave 2: AXI token-efficient grep/glob/file_read outputs
  vision_tools: false    # image_read multimodal tool (needs vision-capable model)

mcp:
  enabled: false        # Phase 6: MCP server integration
  servers: []
  timeout: 30.0

agent:
  max_tool_rounds: 25
  # Autonomous self-verification for headless `norn run`: after the main run,
  # inject up to N verify turns so the agent confirms its deliverable exists
  # and is correct before exiting. Off by default (interactive users verify
  # themselves); benchmark/headless callers enable via config override.
  auto_verify: false
  auto_verify_max_rounds: 2
  # Wave 2 (C): pre-task decomposition for headless runs. 0 = always plan.
  auto_plan: false
  auto_plan_min_chars: 0
  minify_tool_schemas: true
  # SOTA v2 (W1.1): byte-stable system prompt — static prefix (instructions +
  # env + repo map) cached independently from volatile memory/lessons suffix.
  stable_prompt: false
  # SOTA v2 (W1.2): append-only thread invariant check before each LLM
  # dispatch (fail-open in production; strict via NORN_STRICT_INVARIANTS=1).
  thread_invariants: true
  # Wave 2 (A1): persistent task scratchpad for long-horizon runs. When on,
  # registers a `task_notes` tool and injects the notes each round.
  task_notes: false
  task_notes_path: ".norn/task_notes.md"
  task_notes_max_chars: 4000
  max_tool_result_chars: 8000
  max_turn_output_chars: 30000   # Per-turn budget across all tool calls
  env_bootstrap: true            # Inject [Environment] snapshot into system prompt
  # W3.1: Repo Map — inject AST-based codebase map into system prompt
  repo_map: true
  repo_map_max_chars: 2000
  repo_map_languages:
    - python
    - typescript
  repo_map_exclude:
    - ".venv/**"
    - "venv/**"
    - "node_modules/**"
    - "__pycache__/**"
    - "*.egg-info/**"
    - "dist/**"
    - "build/**"
    - "*_pb2.py"
    - "migrations/**"

context:
  sliding_window: false          # Opt-in: evict old turns when over budget
  max_history_tokens: 8000       # Token budget for conversation history
  recent_turns_keep: 6           # Always keep last N turns verbatim
  summary_max_tokens: 300        # Max tokens for summary of evicted turns
  summary_model: null            # null = use primary model for summarization
  # Dynamic tool selection (W2.3)
  dynamic_tools: false           # Opt-in: send only relevant tool schemas per turn
  always_include_tools:          # Core tools always sent
    - bash
    - file_read
    - file_edit
    - file_write
  max_tools_per_turn: 8          # Max tools sent per turn when dynamic_tools enabled

router:
  enabled: true         # Phase 7: 3-tier routing (fast/standard/powerful) with technical-error fallback
  domain_routing: true  # Phase 10: domain-aware routing signals
  tiers:
    fast:
      provider: "ollama"
      model: "qwen3-coder:480b-cloud"
    standard:
      provider: "groq"
      model: "llama-3.3-70b-versatile"
    powerful:
      provider: "openrouter"
      model: "meta-llama/llama-3.3-70b-instruct:free"

logging:
  enabled: true
  level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  output: "both"         # console | file | both
  file_dir: "~/.norn/logs"
  include_cost: true
  redact_keys:           # keys whose values are masked in logs
    - "api_key"
    - "authorization"
    - "token"
    - "password"

# SOTA v2 (workstream C): fail-closed bash confinement (macOS seatbelt).
# Orthogonal to permissions: permissions gate whether a command starts,
# the sandbox bounds what it touches while running. If confinement is
# requested but unavailable, execution is REFUSED (never silently unconfined).
sandbox:
  enabled: false
  default_policy: "workspace-write"   # read-only | workspace-write | danger-full-access
  allow_network: false
  extra_write_paths: []
  escalation: "prompt"                # prompt | deny (for danger-full-access requests)

# SOTA v2 (workstream A): record LLM exchanges per session for replay tests.
# Also enabled by `--record` or NORN_RECORD=1.
recording:
  enabled: false
  dir: "~/.norn/recordings"

bench:
  tasks_dir: "benchmarks/tasks"
  results_dir: "benchmarks/results"
  reports_dir: "benchmarks/reports"
  default_n_runs: 1
  default_timeout_seconds: 300
  parallel_tasks: 1
  # SOTA v2: bench agent model (was hardcoded in the CLI).
  provider: "github_copilot"
  model: "claude-sonnet-4.5"
  max_tool_rounds: 20
  inter_task_delay_seconds: 5.0
  judge:
    enabled: true
    model: "anthropic/claude-sonnet-4"
    pass_threshold: 7.0

