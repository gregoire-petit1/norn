# configs/default.yaml
llm:
  provider: "ollama"
  model: "qwen3-coder:480b-cloud"
  fallback_provider: "openrouter"
  fallback_model: "qwen/qwen3-coder:free"
  # Verified free OpenRouter models with tool support:
  #   stepfun/step-3.5-flash:free             (StepFun, 256k ctx, reasoning, TESTED OK)
  #   nvidia/nemotron-3-super-120b-a12b:free  (Nvidia, 262k ctx, fast)
  #   qwen/qwen3.6-plus-preview:free          (Alibaba, 1M ctx, reasoning)
  #   qwen/qwen3-coder:free                   (Alibaba, 262k ctx, code-focused)
  # Paid models (require credits):
  #   anthropic/claude-sonnet-4
  # For Ollama local:
  #   provider: "ollama"
  #   model: "qwen2.5-coder:14b"
  temperature: 0.0
  max_tokens: 4096
  # Phase 9 v2 — Workstream G. Tag system prompt + last tool schema with
  # `cache_control: ephemeral` for providers that honour it (Anthropic
  # direct, Anthropic via OpenRouter, OpenAI gpt-4o/4.1). Harmless on
  # other providers thanks to an internal eligibility gate. Disable to
  # opt out globally.
  prompt_cache: true

permissions:
  mode: "interactive"  # interactive | auto | yolo | strict

flags:
  dream_system: false   # Phase 3
  coordinator: false    # Phase 4
  ml_tools: true        # Phase 5: PyTorch/Polars/sklearn tools
  web_search: false     # Phase 6: DuckDuckGo search + web fetch
  mcp: false            # Phase 6: MCP server tools
  bench: false           # Phase 10: Benchmark harness

mcp:
  enabled: false        # Phase 6: MCP server integration
  servers: []
  timeout: 30.0

agent:
  max_tool_rounds: 25
  minify_tool_schemas: true
  max_tool_result_chars: 8000
  max_turn_output_chars: 30000   # Per-turn budget across all tool calls
  env_bootstrap: true            # Inject [Environment] snapshot into system prompt
  # W3.1: Repo Map — inject AST-based codebase map into system prompt
  repo_map: true
  repo_map_max_chars: 2000
  repo_map_languages:
    - python
    - typescript
  repo_map_exclude:
    - ".venv/**"
    - "venv/**"
    - "node_modules/**"
    - "__pycache__/**"
    - "*.egg-info/**"
    - "dist/**"
    - "build/**"
    - "*_pb2.py"
    - "migrations/**"

context:
  sliding_window: false          # Opt-in: evict old turns when over budget
  max_history_tokens: 8000       # Token budget for conversation history
  recent_turns_keep: 6           # Always keep last N turns verbatim
  summary_max_tokens: 300        # Max tokens for summary of evicted turns
  summary_model: null            # null = use primary model for summarization
  # Dynamic tool selection (W2.3)
  dynamic_tools: false           # Opt-in: send only relevant tool schemas per turn
  always_include_tools:          # Core tools always sent
    - bash
    - file_read
    - file_edit
    - file_write
  max_tools_per_turn: 8          # Max tools sent per turn when dynamic_tools enabled

router:
  enabled: true         # Phase 7: 3-tier routing (fast/standard/powerful) with technical-error fallback
  domain_routing: true  # Phase 10: domain-aware routing signals
  tiers:
    fast:
      provider: "ollama"
      model: "qwen3-coder:480b-cloud"
    standard:
      provider: "groq"
      model: "llama-3.3-70b-versatile"
    powerful:
      provider: "openrouter"
      model: "meta-llama/llama-3.3-70b-instruct:free"

logging:
  enabled: true
  level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  output: "both"         # console | file | both
  file_dir: "~/.norn/logs"
  include_cost: true
  redact_keys:           # keys whose values are masked in logs
    - "api_key"
    - "authorization"
    - "token"
    - "password"

bench:
  tasks_dir: "benchmarks/tasks"
  results_dir: "benchmarks/results"
  reports_dir: "benchmarks/reports"
  default_n_runs: 1
  default_timeout_seconds: 300
  parallel_tasks: 1
  judge:
    enabled: true
    model: "anthropic/claude-sonnet-4"
    pass_threshold: 7.0

